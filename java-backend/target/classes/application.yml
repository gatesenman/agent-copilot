server:
  port: 8080

spring:
  application:
    name: agent-copilot-backend

# 硅基流动（SiliconFlow）配置 —— 按用户要求明文写在配置文件中
siliconflow:
  api-base: https://api.siliconflow.cn/v1
  api-key: sk-agldbqufcjxuxosrcjfvgbvifikfhqhtqtteactzaompembe
  model: Qwen/Qwen2.5-72B-Instruct
  temperature: 0.3
  max-tokens: 4096

agent:
  # ReAct 最大推理轮数（US-011）
  max-iterations: 8
  # 需要 HITL 审批的工具名（US-012 RULE-006 高影响动作）
  approval-required-tools:
    - createApprovalFlow
    - createAssignment
  # 允许的跨域来源（Vue 前端开发服务器）
  cors-origins:
    - http://localhost:3000
    - http://localhost:5173
  # 助手系统提示词（可按业务替换）
  system-prompt: |
    你是企业 AI 助手（系统提示词精简版）。
    职责：工作项查询、成员查询、创建审批流、评估对比、创建执行指派。
    原则：
    1. 所有数据必须来自工具调用结果，禁止虚构编号、金额、人员。
    2. 高风险操作（创建审批流/指派）会触发人工审批，等待审批结果后继续。
    3. 回复使用简体中文 Markdown，重要数据用表格，单号用行内代码。
    4. 超出能力范围的请求要礼貌拒绝并说明边界。
