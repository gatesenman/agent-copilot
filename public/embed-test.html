<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第三方网站模拟页 — embed.js 集成测试</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 32px; background: #f7f7f5; color: #1a1a1a; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; }
    p { line-height: 1.65; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>某企业官网（模拟第三方站点）</h1>
    <p>本页不含任何 Vue 依赖，仅通过两行 script 引入 embed.js，右下角应出现 Copilot 气泡。点击气泡展开对话窗口（iframe 隔离）。</p>
  </main>

  <script>
    window.agentCopilotConfig = {
      baseUrl: '',
      title: '官网智能客服',
      color: '#1a7f64',
      position: 'right',
    }
  </script>
  <script src="/embed.js" defer></script>
</body>
</html>
